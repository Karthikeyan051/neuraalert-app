name: neuraalert
description: "NeuraAlert - Smart medication and alert reminder app by Neurava."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  alarm: ^5.15.0
  flutter_tts: ^4.2.5
  permission_handler: 11.3.1
  android_intent_plus: ^6.1.0
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^18.1.3
  intl: ^0.20.2
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.31
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quotes/
    - assets/sounds/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
